# 物品
item.project-nature-iron.name = 铁
item.project-nature-iron.description = 用于泰拉的多种建筑和弹药。

# 阵营
team.bioed.name = Bioed
team.bioed.description = 拥有低级智慧的碳基生物。

# 单位
unit.project-nature-delta.name = 德尔塔
unit.project-nature-delta.description = 保护装甲核心，可建造建筑。使用激光束修复建筑。

# 方块
## 炮塔
block.project-nature-bacterium.name = 细菌
block.project-nature-bacterium.description = 交替地向敌人发射子弹。

## 生产
block.project-nature-enhance-mechanical-drill.name = 强化机械钻头
block.project-nature-enhance-mechanical-drill.description = 放置在矿物上时，以缓慢的速度无限产出物品。需要电力。

## 运输
block.project-nature-logistics-duct.name = 物流管道
block.project-nature-logistics-duct.description = 向前运输物品，只能存储一个物品。

block.project-nature-logistics-duct-router.name = 物流管道路由器
block.project-nature-logistics-duct-router.description = 将物品平均分配到其它 3 个方向。只接受背面的物品。可被配置为分类器。

block.project-nature-logistics-overflow-duct.name = 物流溢流管道
block.project-nature-logistics-overflow-duct.description = 当前方被堵塞时才会向两侧输出，用于处理多余的物品。

block.project-nature-logistics-underflow-duct.name = 物流欠流管道
block.project-nature-logistics-underflow-duct.description = 与物流溢流管道相反，当两侧均堵塞时才向前运输。

block.project-nature-logistics-duct-bridge.name = 物流管道桥
block.project-nature-logistics-duct-bridge.description = 跨越任意地形或建筑物传输物品。

block.project-nature-logistics-unloader.name = 物流装卸器
block.project-nature-logistics-unloader.description = 从周围的建筑卸载指定物品。

## 电力
block.project-nature-enhance-combustion-generator.name = 强化火力发电机
block.project-nature-enhance-combustion-generator.description = 燃烧煤炭之类的可燃材料发电。

block.project-nature-enhance-power-node.name = 强化电力节点
block.project-nature-enhance-power-node.description = 向连接的其他节点传输电力。存储少量电力。

block.project-nature-enhance-power-node-large.name = 大型强化电力节点
block.project-nature-enhance-power-node-large.description = 连接范围更大的高级电力节点。

block.project-nature-enhance-solar-panel.name = 强化太阳能板
block.project-nature-enhance-solar-panel.description = 利用太阳能产生少量电力。

block.project-nature-enhance-solar-panel-large.name = 强化大型太阳能板
block.project-nature-enhance-solar-panel-large.description = 利用太阳能产生少量电力，比标准强化太阳能电池板更高效。

## 防御
block.project-nature-iron-wall.name = 铁墙
block.project-nature-iron-wall.description = 保护己方建筑，挡下敌方炮弹。

block.project-nature-iron-wall-large.name = 大型铁墙
block.project-nature-iron-wall-large.description = 保护己方建筑，挡下敌方炮弹。

## 功能
block.project-nature-core-armored.name = 装甲核心
block.project-nature-core-armored.description = 针对泰拉的特殊环境而打造的核心。拥有装甲。一旦被摧毁，该区块就会丢失。

# 星球
planet.project-nature-sol.name = 索朗
planet.project-nature-sol.description = 太阳系外的第二星系。

planet.project-nature-terra.name = 泰拉
planet.project-nature-terra.description = 一个表面遍布植被的类地行星。\n[yellow]上方的碳基生物会对你发起攻击，务必注意。

planet.project-nature-luna.name = 露娜
planet.project-nature-luna.description = 泰拉的卫星，较为荒凉。

