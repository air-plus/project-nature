item.project-nature-iron.name = 铁
item.project-nature-iron.description = 用于泰拉的多种建筑和弹药。

# 阵营
team.bioed.name = Bioed
team.bioed.description = 拥有低级智慧的碳基生物。

# 单位
unit.project-nature-delta.name = 德尔塔
unit.project-nature-delta.description = 保护装甲核心，可建造建筑。使用激光束修复建筑。

# 方块
## 炮塔
block.project-nature-bacterium.name = 细菌
block.peoject-nature-bacterium.description = 交替地向敌人发射子弹。

## 生产
block.project-nature-iterative-mechanical-drill.name = 迭代机械钻头
block.project-nature-iterative-mechanical-drill.description = 放置在矿物上时，以缓慢的速度无限产出物品。需要电力。

## 运输
block.project-nature-copper-duct.name = 铜物品管道
block.project-nature-copper-duct.description = 向前运输物品，只能存储一个物品。

block.project-nature-copper-duct-router.name = 铜物品管道路由器
block.project-nature-copper-duct-router.description = 将物品平均分配到其它 3 个方向。只接受背面的物品。可被配置为分类器。

block.project-nature-copper-overflow-duct.name = 铜溢流管道
block.project-nature-copper-overflow-duct.description = 当前方被堵塞时才会向两侧输出，用于处理多余的物品。

block.project-nature-copper-underflow-duct.name = 铜反向溢流管
block.project-nature-copper-underflow-duct.description = 与溢流管道相反，当两侧均堵塞时才向前运输。

block.project-nature-copper-duct-bridge.name = 铜物品管道桥
block.project-nature-copper-duct-bridge.description = 跨越任意地形或建筑物传输物品。

## 电力
block.project-nature-iterative-combustion-generator.name = 迭代火力发电机
block.project-nature-iterative-combustion-generator.description = 燃烧煤炭之类的可燃材料发电。

block.project-nature-iterative-power-node.name = 迭代电力节点
block.project-nature-iterative-power-node.description = 向连接的其他节点传输电力。存储少量电力。

block.project-nature-iterative-power-node-large.name = 大型迭代电力节点
block.project-nature-iterative-power-node-large.description = 连接范围更大的高级电力节点。

block.project-nature-iterative-solar-panel.name = 迭代太阳能板
block.project-nature-iterative-solar-panel.description = 利用太阳能产生少量电力。

block.project-nature-iterative-solar-panel-large.name = 大型迭代太阳能板
block.project-nature-iterative-solar-panel-large.description = 利用太阳能产生少量电力，比标准迭代太阳能电池板更高效。

## 防御
block.project-nature-iron-wall.name = 铁墙
block.project-nature-iron-wall.description = 保护己方建筑，挡下敌方炮弹。

block.project-nature-iron-wall-large.name = 大型铁墙
block.project-nature-iron-wall-large.description = 保护己方建筑，挡下敌方炮弹。

## 功能
block.project-nature-core-armored.name = 装甲核心
block.project-nature-core-armored.description = 针对泰拉的特殊环境而打造的核心。拥有装甲。一旦被摧毁，该区块就会丢失。

# 星球
planet.project-nature-sol.name = 索朗
planet.project-nature-sol.description = Crux 利用行星际加速器逃离了塞普罗并来到了这里。

planet.project-nature-terra.name = 泰拉
planet.project-nature-terra.description = 一个表面遍布植被的类地行星。\n[yellow]上方的碳基生物会对你发起攻击，务必注意。

planet.project-nature-luna.name = 露娜
planet.project-nature-luna.description = 泰拉的卫星，较为荒凉。

